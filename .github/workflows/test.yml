name: test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax check
        run: make check
      - name: End-to-end test
        run: make test
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end test (PowerShell 7)
        shell: pwsh
        run: ./tests/test.ps1
      - name: End-to-end test (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test.ps1
